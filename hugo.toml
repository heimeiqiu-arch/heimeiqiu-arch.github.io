baseURL = 'https://heimeiqiu-arch.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = 'CBPayments｜跨境支付知识分享'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false


[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']   # JSON 供站内搜索使用

[taxonomies]
  category = 'categories'
  tag = 'tags'

[params]
  env = 'production'
  title = 'CBPayments｜跨境支付知识分享'
  description = '个人运营的跨境支付与线上服务付款知识分享网站。本站提供信息内容，不办理开卡、充值或资金收付。'
  keywords = ['跨境支付知识', '线上付款', '支付安全']
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'      # auto / light / dark
  disableThemeToggle = false
  disableLangToggle = true   # 单语言，隐藏语言切换

  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hidemeta = false
  hideSummary = false
  comments = false

  [params.homeInfoParams]
    Title = 'CBPayments｜跨境支付知识分享'
    Content = '''
CBPayments 是个人运营的跨境支付与线上服务付款知识分享项目。本网站由个人运营，前端网页托管于 GitHub Pages（heimeiqiu-arch.github.io）。

本站仅发布一般信息，不提供开卡、充值、代收款、资金保管或支付服务，也不收集账户或支付资料。运营者真实姓名、联系地址、电子邮箱和电话将在核实后补充，本站不会填报虚构的公司或牌照信息。

本站与 Visa、Mastercard、Discover、Google、OpenAI、Stripe 等品牌及其权利人无官方合作、授权、赞助或背书关系。

[关于本站](/about/) · [运营者与网站性质](/disclosures/) · [免责声明](/disclaimer/)
'''

  [[params.socialIcons]]
    name = 'rss'
    url = 'index.xml'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'categories'
  name = '分类'
  url = '/categories/'
  weight = 30

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 40

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 50

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
  lineNos = false
  style = 'monokai'
