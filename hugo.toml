baseURL = 'https://heimeiqiu-arch.github.io/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = 'CBPayments｜虚拟卡与国际支付实用指南'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false


[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']   # JSON 供站内搜索使用

[taxonomies]
  category = 'categories'
  tag = 'tags'

[params]
  env = 'production'
  title = 'CBPayments｜虚拟卡与国际支付实用指南'
  description = '关于虚拟卡与 USDT 充值支付的实用指南；服务主体、费用与适用条件请先查看披露信息'
  keywords = ['虚拟卡', '跨境支付', '国际支付', 'USDT 充值', 'CBPayments']
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'      # auto / light / dark
  disableThemeToggle = false
  disableLangToggle = true   # 单语言，隐藏语言切换

  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hidemeta = false
  hideSummary = false
  comments = false

  [params.homeInfoParams]
    Title = 'CBPayments｜虚拟卡与国际支付实用指南'
    Content = '''
本站为支付信息与实用指南网站，公开介绍的业务包括虚拟卡及 USDT 充值支付。当前页面托管于 GitHub Pages（heimeiqiu-arch.github.io），页面使用 CBPayments 品牌，并有外链指向 cbpayments.cc。

本网站运营主体、实际服务提供方，以及本站与 cbpayments.cc 之间的关系尚未完成公开披露。本站不是 Google、Visa、Mastercard 或 Discover 的官方网站，也不表示获得其授权或背书。

在主体及关系、经营地址、收费项目与金额、支持地区、身份验证要求、服务条款、退款/取消与投诉方式等信息核实并公开前，请勿通过本站注册或充值。本站不提供支付入口，也不要求用户在本站提交银行卡号、验证码、密码或身份证明。

[查看服务与主体披露](/disclosures/)
'''

  [[params.socialIcons]]
    name = 'link'
    url = 'https://cbpayments.cc'

  [[params.socialIcons]]
    name = 'rss'
    url = 'index.xml'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'categories'
  name = '分类'
  url = '/categories/'
  weight = 30

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 40

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 50

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
  lineNos = false
  style = 'monokai'
