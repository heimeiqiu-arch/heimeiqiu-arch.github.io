# Optimized workflow for CBPayments Hugo SEO publishing
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Always deploy the newest version instead of building a queue of old commits
concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.146.0

    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: |
          npm install --global sass
          sass --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Enforce article SEO fields and length
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          before = os.environ.get("PUSH_BEFORE", "")
          after = os.environ["GITHUB_SHA"]
          if not before or set(before) == {"0"}:
              print("No previous commit to compare; skipping changed-article validation.")
              raise SystemExit(0)

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", before, after], text=True
          ).splitlines()
          posts = [
              path for path in changed
              if path.startswith("content/posts/")
              and path.endswith(".md")
              and not path.endswith("/_index.md")
          ]
          if not posts:
              print("No article files changed.")
              raise SystemExit(0)

          errors = []
          for path in posts:
              with open(path, encoding="utf-8") as handle:
                  raw = handle.read()
              parts = re.split(r"(?m)^---\s*$", raw, maxsplit=2)
              if len(parts) < 3:
                  errors.append(f"{path}: missing YAML front matter")
                  continue

              front = parts[1]
              body = parts[2]
              for field in ("title", "description", "slug", "tags"):
                  if not re.search(rf"(?m)^{field}:\s*\S", front):
                      errors.append(f"{path}: missing or empty {field}")
              chinese_chars = len(re.findall(r"[\u3400-\u4DBF\u4E00-\u9FFF]", body))
              print(f"{path}: {chinese_chars} Chinese characters")
              if chinese_chars < 2000:
                  errors.append(f"{path}: {chinese_chars} Chinese characters; minimum is 2000")

          if errors:
              print("\nArticle publishing checks failed:")
              print("\n".join(f"- {error}" for error in errors))
              sys.exit(1)
          print("Article SEO metadata and length checks passed.")
          PY

      - name: Cache Hugo
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.sha }}
          restore-keys: |
            hugo-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Verify generated SEO files
        run: |
          test -f public/index.html
          test -f public/robots.txt
          test -f public/sitemap.xml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
