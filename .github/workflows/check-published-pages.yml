name: Verify published article URLs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-published-pages.yml"
  schedule:
    # Daily at 02:00 UTC (11:00 Japan time)
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check sitemap and published URLs
        env:
          SITE_URL: https://heimeiqiu-arch.github.io
        run: |
          python - <<'PY'
          import concurrent.futures
          import os
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          site = os.environ["SITE_URL"].rstrip("/")
          sitemap_url = site + "/sitemap.xml"
          headers = {"User-Agent": "CBPayments-Published-URL-Checker/1.0"}

          def fetch(url, timeout=20):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.status, response.geturl(), response.read()

          print(f"Reading sitemap: {sitemap_url}")
          status, final_url, body = fetch(sitemap_url)
          if status != 200:
              raise SystemExit(f"Sitemap returned HTTP {status}")

          root = ET.fromstring(body)
          urls = [node.text.strip() for node in root.iter() if node.tag.endswith("loc") and node.text]
          urls = list(dict.fromkeys(urls))
          if not urls:
              raise SystemExit("No URLs found in sitemap; refusing to report a false success.")

          print(f"Found {len(urls)} unique URLs. Checking them with up to 12 concurrent requests.")

          def check(url):
              last_error = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=20) as response:
                          code = response.status
                          final = response.geturl()
                      if 200 <= code < 400:
                          return url, code, final, None
                      last_error = f"HTTP {code}"
                  except urllib.error.HTTPError as e:
                      last_error = f"HTTP {e.code}"
                      if e.code < 500 and e.code != 429:
                          break
                  except Exception as e:
                      last_error = f"{type(e).__name__}: {e}"
                  if attempt < 2:
                      time.sleep(2 * (attempt + 1))
              return url, None, None, last_error or "Unknown error"

          checked = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(check, url) for url in urls]
              for future in concurrent.futures.as_completed(futures):
                  checked.append(future.result())

          failures = sorted([item for item in checked if item[3]], key=lambda x: x[0])
          successes = len(checked) - len(failures)
          print(f"\nRESULT: {successes}/{len(checked)} URLs returned HTTP 2xx/3xx; {len(failures)} failed.")
          if failures:
              print("\nFailed URLs (up to 200 shown):")
              for url, _, _, error in failures[:200]:
                  print(f"- {url} :: {error}")
              if len(failures) > 200:
                  print(f"... plus {len(failures) - 200} more failures.")
              raise SystemExit(1)

          print("All URLs listed in the sitemap are reachable.")
          PY
