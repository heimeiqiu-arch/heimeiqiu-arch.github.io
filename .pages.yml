# Pages CMS 配置
# https://pagescms.org/docs/configuration/

media:
  input: static/images
  output: /images


content:

  # =====================
  # 英文文章
  # =====================
  - name: english
    label: 英文
    type: collection
    path: content/posts/英文
    format: yaml-frontmatter
    filename: "{fields.slug}.md"

    exclude:
      - _index.md

    view:
      fields: [title, date, draft, categories]
      primary: title
      sort: [date, title]
      search: [title, categories, tags]
      default:
        sort: date
        order: desc

    fields:

      - name: title
        label: 标题
        type: string
        required: true

      - name: slug
        label: 英文别名
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

      - name: date
        label: 发布时间
        type: date
        required: true

      - name: draft
        label: 草稿
        type: boolean
        default: false

      - name: categories
        label: 分类
        type: string
        list: true

      - name: tags
        label: 标签
        type: string
        list: true

      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown



  # =====================
  # 香港中文文章
