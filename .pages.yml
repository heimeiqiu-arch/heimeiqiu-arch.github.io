    fields:

      - name: title
        label: 标题
        type: string
        required: true

      - name: slug
        label: 英文别名
        type: string
        required: true

      - name: date
        label: 发布时间
        type: date
        required: true

      - name: draft
        label: 草稿
        type: boolean
        default: false

      - name: categories
        label: 分类
        type: string
